<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Company World 3D — V0.4 RC1 — Business Empire</title>
  </head>
  <body>
    <div id="root"><div id="boot-status" style="padding:24px;font:16px system-ui;color:#e2e8f0;background:#111827;min-height:100vh;box-sizing:border-box">Đang tải AI Company World 3D V0.4…</div></div>
    <script>
      (function () {
        function report(message) {
          var status = document.getElementById('boot-status');
          if (status) status.textContent = 'Không thể khởi động game: ' + message + '. Thử Ctrl + F5 hoặc mở F12 → Console để kiểm tra.';
        }
        window.addEventListener('error', function (event) {
          if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) report('Không tải được tài nguyên ' + (event.target.src || event.target.href || ''));
          else if (event.message) report(event.message);
        }, true);
        window.addEventListener('unhandledrejection', function (event) { report(String(event.reason)); });
        window.setTimeout(function () { if (document.getElementById('boot-status')) report('Game chưa khởi tạo sau 30 giây'); }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
