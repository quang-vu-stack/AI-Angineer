const APP_DATA = {"stages": [{"name": "Khởi động cùng AI", "sub": "Hiểu nghề, cài công cụ và học cách tư duy như kỹ sư", "weeks": 3, "color": "#7c8fff", "icon": "◎", "level": "Cơ bản", "outcome": "Giải thích được AI Engineer làm gì, biết dùng VS Code, terminal và GitHub.", "resource": "https://www.python.org/about/gettingstarted/", "units": [{"id": "0-0", "title": "AI, ML, Deep Learning và LLM là gì?", "theory": "AI là lĩnh vực tạo hệ thống có hành vi thông minh; ML học quy luật từ dữ liệu; Deep Learning dùng mạng nơ-ron nhiều tầng; LLM xử lý và tạo ngôn ngữ. AI Engineer thiết kế, kết nối, đánh giá và vận hành các hệ thống này.", "task": "Vẽ sơ đồ mối quan hệ AI → ML → Deep Learning và đưa 3 ví dụ đời thường.", "code": "", "stage": 0, "number": 1}, {"id": "0-1", "title": "AI Engineer làm gì trong một ngày?", "theory": "Công việc đi từ xác định vấn đề → lấy dữ liệu → xây mô hình hoặc tích hợp model → đánh giá → triển khai và theo dõi. Khác biệt với việc chỉ viết prompt là phải xây sản phẩm ổn định.", "task": "Viết 5 công việc mà một AI Engineer cần làm cho chatbot hỗ trợ sinh viên.", "code": "", "stage": 0, "number": 2}, {"id": "0-2", "title": "Cài Python, VS Code và Git", "theory": "Python chạy mã; VS Code giúp viết và gỡ lỗi; Git ghi lịch sử thay đổi. Kiểm tra phiên bản bằng python --version và git --version trong terminal.", "task": "Cài Python, VS Code, Git. Tạo thư mục ai-journey và chạy chương trình Hello AI.", "code": "print(\"Hello AI Engineer!\")\nprint(\"Mình bắt đầu từ con số 0.\")", "stage": 0, "number": 3}, {"id": "0-3", "title": "Terminal, thư mục và file", "theory": "Terminal là nơi chạy lệnh. cd đổi thư mục, dir hoặc ls xem file, mkdir tạo thư mục. Hiểu đường dẫn tuyệt đối và tương đối để tránh lỗi chạy code.", "task": "Tạo ai-journey/day01/main.py bằng terminal và chạy nó.", "code": "# Mở terminal trong thư mục dự án:\n# python --version\n# git --version\n\nprint(\"Terminal đã sẵn sàng\")", "stage": 0, "number": 4}, {"id": "0-4", "title": "Làm quen GitHub và Colab", "theory": "GitHub lưu và chia sẻ dự án Git. Google Colab cho phép chạy notebook Python trên trình duyệt; hữu ích khi máy chưa mạnh. Không đưa API key lên GitHub.", "task": "Tạo repository ai-engineer-journey và đẩy file README.md đầu tiên.", "code": "", "stage": 0, "number": 5}], "id": 0, "quiz": {"q": "ML khác lập trình quy tắc cứng ở đâu?", "answers": ["ML học quy luật từ dữ liệu", "ML không cần dữ liệu", "ML luôn đúng", "ML chỉ làm website"], "correct": 0, "why": "Machine Learning học từ dữ liệu để suy ra mẫu; vẫn cần code, tiêu chí đánh giá và giám sát."}}, {"name": "Python từ con số 0", "sub": "Biến, câu lệnh, điều kiện, vòng lặp, hàm và cấu trúc dữ liệu", "weeks": 10, "color": "#4edbb2", "icon": "⌘", "level": "Cơ bản", "outcome": "Tự viết được ứng dụng Python console 100–200 dòng, không sao chép máy móc.", "resource": "https://docs.python.org/3/tutorial/", "units": [{"id": "1-0", "title": "In ra màn hình và biến", "theory": "print() hiển thị nội dung. Biến là tên tham chiếu đến dữ liệu; ví dụ age = 19. Python tự suy ra kiểu, nhưng cần đặt tên rõ nghĩa.", "task": "Nhập tên, ngành học và mục tiêu rồi in thông điệp giới thiệu.", "code": "ten = input(\"Tên của bạn: \")\nnganh = \"Công nghệ thông tin\"\nprint(f\"Xin chào {ten}! Chào mừng đến với {nganh}.\")", "stage": 1, "number": 1}, {"id": "1-1", "title": "Kiểu dữ liệu và ép kiểu", "theory": "int là số nguyên, float là số thực, str là chuỗi, bool là đúng/sai. input() trả về chuỗi; dùng int(input(...)) khi cần tính toán.", "task": "Viết chương trình tính số tiền tiết kiệm trong 30 ngày.", "code": "tien_moi_ngay = int(input(\"Mỗi ngày tiết kiệm (VNĐ): \"))\nso_ngay = 30\ntong = tien_moi_ngay * so_ngay\nprint(f\"Sau 30 ngày: {tong:,} VNĐ\")", "stage": 1, "number": 2}, {"id": "1-2", "title": "Toán tử và f-string", "theory": "Các toán tử + - * / // % ** dùng để tính toán. f-string chèn biểu thức vào chuỗi, ví dụ f\"Tổng: {total}\".", "task": "Lập chương trình tính điểm trung bình và in kết quả đẹp.", "code": "giua_ky = 8.0\ncuoi_ky = 7.5\ntrung_binh = giua_ky * 0.4 + cuoi_ky * 0.6\nprint(f\"Điểm trung bình: {trung_binh:.2f}\")", "stage": 1, "number": 3}, {"id": "1-3", "title": "Điều kiện if / elif / else", "theory": "Điều kiện cho phép chương trình quyết định dựa trên biểu thức True/False. Chú ý thụt đầu dòng 4 dấu cách và toán tử so sánh.", "task": "Phân loại điểm A, B, C, D, F theo thang bạn tự chọn.", "code": "diem = float(input(\"Nhập điểm: \"))\nif diem >= 8.5:\n    print(\"Giỏi\")\nelif diem >= 7:\n    print(\"Khá\")\nelse:\n    print(\"Cần cố gắng\")", "stage": 1, "number": 4}, {"id": "1-4", "title": "Vòng lặp for / while", "theory": "for phù hợp khi duyệt dãy phần tử; while lặp đến khi điều kiện sai. break dừng và continue bỏ qua lượt hiện tại.", "task": "In bảng cửu chương 2–9 và trò chơi đoán số.", "code": "for bang in range(2, 4):\n    for i in range(1, 11):\n        print(f\"{bang} x {i} = {bang*i}\")", "stage": 1, "number": 5}, {"id": "1-5", "title": "List, tuple, set, dictionary", "theory": "List có thứ tự và thay đổi được; tuple cố định; set lưu phần tử duy nhất; dict ánh xạ khóa–giá trị. Chọn cấu trúc phù hợp bài toán.", "task": "Quản lý danh sách 5 môn học và điểm số bằng dict.", "code": "mon_hoc = {\"Python\": 9.0, \"Toán\": 7.5, \"SQL\": 8.0}\nfor ten, diem in mon_hoc.items():\n    print(f\"{ten}: {diem}\")", "stage": 1, "number": 6}, {"id": "1-6", "title": "Hàm và phạm vi biến", "theory": "def tạo hàm tái sử dụng; tham số nhận đầu vào, return trả kết quả. Tách các khối xử lý thành hàm nhỏ dễ kiểm thử.", "task": "Viết các hàm tinh_gpa(), xep_loai() và in_bao_cao().", "code": "def tinh_diem_tb(ds_diem):\n    return sum(ds_diem) / len(ds_diem)\n\nprint(tinh_diem_tb([8, 7, 9]))", "stage": 1, "number": 7}, {"id": "1-7", "title": "Xử lý lỗi và đọc file", "theory": "try/except xử lý dữ liệu không hợp lệ. with open(...) giúp đóng file đúng cách. JSON dùng để lưu các dict/list cơ bản.", "task": "Làm danh sách việc cần làm lưu trong file JSON.", "code": "import json\n\nviec_lam = [\"Học Python\", \"Làm bài tập\"]\nwith open(\"todo.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(viec_lam, f, ensure_ascii=False)", "stage": 1, "number": 8}, {"id": "1-8", "title": "Ôn tập Python: mini app", "theory": "Kết hợp nhập dữ liệu, vòng lặp, hàm, dict và file thành chương trình có menu. Tự kiểm tra các trường hợp nhập rỗng và nhập sai.", "task": "Hoàn thiện ứng dụng quản lý chi tiêu mini bằng Python console.", "code": "def menu():\n    print(\"1. Thêm khoản chi\")\n    print(\"2. Xem báo cáo\")\n    print(\"0. Thoát\")\n\nmenu()", "stage": 1, "number": 9}], "id": 1, "quiz": {"q": "input() trong Python trả về kiểu nào?", "answers": ["int", "float", "str", "bool"], "correct": 2, "why": "input() luôn trả chuỗi; cần ép kiểu nếu muốn tính toán số."}}, {"name": "Python thực chiến & công cụ", "sub": "OOP, môi trường, kiểm thử, Git và gọi API", "weeks": 8, "color": "#49c9eb", "icon": "</>", "level": "Cơ bản", "outcome": "Có repo Python sạch, có README, test và quản lý dependency.", "resource": "https://docs.pytest.org/en/stable/getting-started.html", "units": [{"id": "2-0", "title": "Module, import, pip và venv", "theory": "Module tách chương trình thành nhiều file. venv cách ly thư viện theo dự án; pip quản lý các gói Python.", "task": "Tạo .venv, cài requests và lưu requirements.txt.", "code": "", "stage": 2, "number": 1}, {"id": "2-1", "title": "OOP: class và object", "theory": "Class mô tả đối tượng gồm thuộc tính và hành vi. __init__ khởi tạo trạng thái; method xử lý dữ liệu của object.", "task": "Tạo class Student để lưu tên, điểm và tính GPA.", "code": "class Student:\n    def __init__(self, name, scores):\n        self.name = name\n        self.scores = scores\n\n    def average(self):\n        return sum(self.scores) / len(self.scores)\n\na = Student(\"An\", [7, 8, 9])\nprint(a.average())", "stage": 2, "number": 2}, {"id": "2-2", "title": "Comprehension và iterator", "theory": "List comprehension tạo list gọn. Iterator và generator xử lý tuần tự, hữu ích khi tập dữ liệu lớn.", "task": "Lọc các số chẵn và viết generator đọc từng dòng file.", "code": "", "stage": 2, "number": 3}, {"id": "2-3", "title": "API, HTTP, JSON", "theory": "HTTP GET lấy dữ liệu, POST gửi dữ liệu. API trả JSON; cần kiểm tra trạng thái, timeout và lỗi mạng.", "task": "Dùng API công khai miễn phí lấy dữ liệu thử nghiệm và xử lý lỗi.", "code": "", "stage": 2, "number": 4}, {"id": "2-4", "title": "Git branch, commit, pull request", "theory": "Commit là bản ghi thay đổi; branch cho phép phát triển độc lập; pull request giúp rà soát trước khi gộp mã.", "task": "Tạo nhánh feature/report, thêm tính năng và mở pull request.", "code": "", "stage": 2, "number": 5}, {"id": "2-5", "title": "Testing và clean code", "theory": "Kiểm thử xác nhận kết quả dự kiến. Code dễ đọc có tên rõ, hàm ngắn, tránh lặp và có kiểm soát lỗi.", "task": "Viết 5 unit test cho chức năng tính điểm hoặc chi tiêu.", "code": "", "stage": 2, "number": 6}], "id": 2, "quiz": {"q": "Tại sao dùng virtual environment?", "answers": ["Tăng GPU", "Cách ly thư viện theo dự án", "Thay GitHub", "Xóa mọi lỗi"], "correct": 1, "why": "venv tách dependency của từng dự án, tránh xung đột phiên bản."}}, {"name": "Toán nền tảng cho AI", "sub": "Đại số tuyến tính, xác suất, thống kê và đạo hàm", "weeks": 8, "color": "#f8b967", "icon": "∑", "level": "Nền tảng AI", "outcome": "Giải thích vector, gradient, loss và xác suất bằng hình dung và code.", "resource": "https://www.khanacademy.org/math/linear-algebra", "units": [{"id": "3-0", "title": "Hàm số, đồ thị và tư duy tối ưu", "theory": "Mô hình ML thường nhận x và trả y. Hàm số mô tả quan hệ; tối ưu là tìm tham số để giảm sai số.", "task": "Vẽ y = 2x + 1 và y = x² bằng Python.", "code": "", "stage": 3, "number": 1}, {"id": "3-1", "title": "Vector và phép toán vector", "theory": "Vector là danh sách số biểu diễn vị trí hoặc đặc trưng. Cộng vector, tích vô hướng và độ dài là nền tảng embeddings.", "task": "Tính cosine similarity cho hai vector ngắn.", "code": "import math\na = [1, 2, 3]\nb = [2, 4, 6]\ndot = sum(x*y for x, y in zip(a, b))\nnorm = lambda v: math.sqrt(sum(x*x for x in v))\nprint(\"Cosine:\", dot / (norm(a) * norm(b)))", "stage": 3, "number": 2}, {"id": "3-2", "title": "Ma trận và nhân ma trận", "theory": "Ma trận lưu dữ liệu hai chiều; nhân ma trận kết hợp các phép biến đổi. Dữ liệu tabular thường là ma trận số.", "task": "Tính tích hai ma trận nhỏ bằng NumPy và giải thích shape.", "code": "", "stage": 3, "number": 3}, {"id": "3-3", "title": "Đạo hàm và gradient descent", "theory": "Đạo hàm đo tốc độ thay đổi; gradient cho biết hướng tăng nhanh nhất. Gradient descent cập nhật tham số theo hướng giảm loss.", "task": "Tự code gradient descent cho f(x) = (x - 3)².", "code": "x = 0.0\nlr = 0.1\nfor step in range(30):\n    gradient = 2 * (x - 3)\n    x -= lr * gradient\nprint(\"Điểm cực tiểu gần x =\", round(x, 4))", "stage": 3, "number": 4}, {"id": "3-4", "title": "Xác suất cơ bản và Bayes", "theory": "Xác suất mô tả độ bất định. Xác suất có điều kiện và định lý Bayes giúp cập nhật niềm tin dựa trên quan sát.", "task": "Giải bài toán lọc thư rác bằng xác suất có điều kiện.", "code": "", "stage": 3, "number": 5}, {"id": "3-5", "title": "Thống kê mô tả và phân phối", "theory": "Mean, median, variance, standard deviation mô tả dữ liệu. Hiểu outlier và phân phối để tránh kết luận sai.", "task": "Tính trung bình, trung vị và độ lệch chuẩn từ 30 số.", "code": "", "stage": 3, "number": 6}, {"id": "3-6", "title": "Ôn tập toán bằng NumPy", "theory": "Dùng NumPy để thực hành vector, ma trận và thống kê. Tập diễn giải kết quả bằng lời thay vì chỉ chạy code.", "task": "Viết notebook trực quan hóa gradient và cosine similarity.", "code": "", "stage": 3, "number": 7}], "id": 3, "quiz": {"q": "Gradient descent thường nhằm mục đích gì?", "answers": ["Tăng loss", "Giảm loss bằng cập nhật tham số", "Xóa dữ liệu", "Mã hóa dữ liệu"], "correct": 1, "why": "Gradient biểu thị hướng tăng; đi ngược gradient để giảm hàm mất mát."}}, {"name": "Dữ liệu, Pandas & SQL", "sub": "Thu thập, làm sạch, phân tích và trực quan hóa", "weeks": 8, "color": "#9f8afc", "icon": "▦", "level": "Nền tảng AI", "outcome": "Phân tích tập dữ liệu thực và tránh data leakage.", "resource": "https://pandas.pydata.org/docs/getting_started/index.html", "units": [{"id": "4-0", "title": "NumPy và thao tác array", "theory": "ndarray là mảng số hiệu quả; shape, axis và broadcasting quyết định cách phép tính hoạt động.", "task": "Tính tổng, trung bình theo cột của bảng điểm.", "code": "# Bài sau cần cài NumPy: pip install numpy\nimport numpy as np\na = np.array([[1, 2], [3, 4]])\nprint(\"Shape:\", a.shape)\nprint(\"Trung bình cột:\", a.mean(axis=0))", "stage": 4, "number": 1}, {"id": "4-1", "title": "Pandas DataFrame", "theory": "DataFrame giống bảng dữ liệu có cột và hàng; dùng read_csv, loc, groupby để thao tác.", "task": "Đọc CSV, thống kê tổng tiền theo từng nhóm.", "code": "# Cài trước: pip install pandas\nimport pandas as pd\ndf = pd.DataFrame({\"mon\": [\"AI\", \"Python\"], \"diem\": [9, 8]})\nprint(df.groupby(\"mon\")[\"diem\"].mean())", "stage": 4, "number": 2}, {"id": "4-2", "title": "Làm sạch missing/outlier", "theory": "Missing value là ô thiếu; outlier là giá trị bất thường. Xử lý tùy bản chất dữ liệu, không xóa tùy tiện.", "task": "Làm sạch một bảng dữ liệu có ô trống, trùng lặp và ngoại lệ.", "code": "", "stage": 4, "number": 3}, {"id": "4-3", "title": "SQL: SELECT, JOIN, GROUP BY", "theory": "SQL truy vấn dữ liệu có cấu trúc. SELECT lọc cột, WHERE lọc hàng, JOIN nối bảng, GROUP BY tổng hợp.", "task": "Tạo SQLite database quản lý học tập và viết 5 câu query.", "code": "", "stage": 4, "number": 4}, {"id": "4-4", "title": "Trực quan hóa dữ liệu", "theory": "Histogram xem phân phối; scatter xem quan hệ; line chart xem xu hướng. Đồ thị cần trục và nhãn rõ.", "task": "Tạo dashboard 3 biểu đồ với matplotlib.", "code": "", "stage": 4, "number": 5}, {"id": "4-5", "title": "EDA và chuẩn bị dữ liệu", "theory": "EDA là khám phá dữ liệu trước khi xây mô hình. Chia train/test trước khi fit tiền xử lý để tránh leakage.", "task": "Hoàn thiện notebook EDA với kết luận bằng tiếng Việt.", "code": "", "stage": 4, "number": 6}], "id": 4, "quiz": {"q": "Data leakage làm điều gì nguy hiểm?", "answers": ["Tăng dung lượng file", "Làm đánh giá quá lạc quan", "Giảm số cột", "Không ảnh hưởng"], "correct": 1, "why": "Thông tin từ test len vào training khiến kết quả kiểm thử không đáng tin."}}, {"name": "Machine Learning", "sub": "Hồi quy, phân loại, đánh giá và chọn mô hình", "weeks": 10, "color": "#f47c96", "icon": "◇", "level": "Trung cấp", "outcome": "Huấn luyện, đánh giá và giải thích mô hình scikit-learn có thể tái lập.", "resource": "https://scikit-learn.org/stable/getting_started.html", "units": [{"id": "5-0", "title": "ML workflow & train/validation/test", "theory": "ML gồm dữ liệu, features, model, loss, training và evaluation. Giữ tập test độc lập đến đánh giá cuối cùng.", "task": "Vẽ pipeline đầy đủ cho bài toán dự đoán giá nhà.", "code": "", "stage": 5, "number": 1}, {"id": "5-1", "title": "Linear regression", "theory": "Hồi quy tuyến tính dự đoán giá trị liên tục bằng trọng số của đặc trưng. MAE, MSE và R² dùng đánh giá.", "task": "Huấn luyện mô hình dự đoán điểm thi từ số giờ học.", "code": "# Cài trước: pip install scikit-learn\nfrom sklearn.linear_model import LinearRegression\nmodel = LinearRegression().fit([[1], [2], [3]], [2, 4, 6])\nprint(model.predict([[4]]))", "stage": 5, "number": 2}, {"id": "5-2", "title": "Logistic regression & classification", "theory": "Phân loại dự đoán nhãn; logistic regression mô hình hóa xác suất. Dùng confusion matrix, precision, recall, F1.", "task": "Xây bộ phân loại tin nhắn spam bằng dữ liệu mẫu.", "code": "", "stage": 5, "number": 3}, {"id": "5-3", "title": "Decision tree & random forest", "theory": "Cây quyết định chia dữ liệu theo luật; random forest kết hợp nhiều cây để giảm phương sai.", "task": "So sánh decision tree và random forest trên cùng tập dữ liệu.", "code": "", "stage": 5, "number": 4}, {"id": "5-4", "title": "KNN, SVM và clustering", "theory": "KNN dựa trên hàng xóm gần; SVM tìm ranh giới; K-Means gom các điểm tương tự không cần nhãn.", "task": "Phân nhóm người dùng bằng K-Means và đánh giá kết quả.", "code": "", "stage": 5, "number": 5}, {"id": "5-5", "title": "Feature engineering & preprocessing", "theory": "Scale, encode, impute tạo đặc trưng phù hợp. Dùng sklearn Pipeline để fit biến đổi chỉ trên train.", "task": "Tạo pipeline ColumnTransformer cho dữ liệu số và phân loại.", "code": "", "stage": 5, "number": 6}, {"id": "5-6", "title": "Cross-validation và tuning", "theory": "Cross-validation đo độ ổn định qua nhiều phần chia. Tuning chọn siêu tham số; chỉ tối ưu trên train/validation.", "task": "Chạy RandomizedSearchCV và ghi lại kết quả tốt nhất.", "code": "", "stage": 5, "number": 7}, {"id": "5-7", "title": "Giải thích mô hình và công bằng", "theory": "Feature importance và permutation importance hỗ trợ giải thích. Kiểm tra lệch dữ liệu, bias và độ tin cậy.", "task": "Viết model card nêu dữ liệu, giới hạn và nguy cơ sai lệch.", "code": "", "stage": 5, "number": 8}], "id": 5, "quiz": {"q": "Tập test nên được dùng chủ yếu khi nào?", "answers": ["Mỗi lần sửa hyperparameter", "Đánh giá cuối cùng sau khi chọn mô hình", "Để fit scaler", "Để tạo nhãn train"], "correct": 1, "why": "Dùng validation để điều chỉnh; test để đo mức tổng quát hóa cuối cùng."}}, {"name": "Deep Learning với PyTorch", "sub": "Tensor, neural network, CNN và chu trình huấn luyện", "weeks": 10, "color": "#e6ab55", "icon": "◈", "level": "Trung cấp", "outcome": "Tự viết training loop, lưu model và phân tích overfitting.", "resource": "https://docs.pytorch.org/tutorials/beginner/basics/intro.html", "units": [{"id": "6-0", "title": "Neural network, neuron và activation", "theory": "Mạng nơ-ron ghép nhiều phép biến đổi tuyến tính và phi tuyến; activation cho phép học quan hệ phức tạp.", "task": "Vẽ kiến trúc một mạng 2 lớp và tính số tham số.", "code": "", "stage": 6, "number": 1}, {"id": "6-1", "title": "Tensor và autograd PyTorch", "theory": "Tensor là cấu trúc số nhiều chiều; autograd tính gradient tự động để cập nhật trọng số.", "task": "Tạo tensor và tính gradient của y = x².", "code": "# Cài trước: pip install torch\nimport torch\nx = torch.tensor(3.0, requires_grad=True)\ny = x ** 2\ny.backward()\nprint(x.grad)  # 6", "stage": 6, "number": 2}, {"id": "6-2", "title": "Dataset và DataLoader", "theory": "Dataset đóng gói mẫu; DataLoader tạo batch và shuffle phục vụ huấn luyện.", "task": "Tạo DataLoader cho bộ dữ liệu phân loại đơn giản.", "code": "", "stage": 6, "number": 3}, {"id": "6-3", "title": "Xây và train MLP", "theory": "nn.Module định nghĩa mạng; loss và optimizer điều khiển cập nhật. Vòng lặp gồm forward, loss, backward, step.", "task": "Train MLP phân loại FashionMNIST, ghi loss/accuracy.", "code": "", "stage": 6, "number": 4}, {"id": "6-4", "title": "CNN và nhận diện ảnh", "theory": "Convolution học đặc trưng cục bộ như cạnh/hình dạng. CNN phù hợp nhiều bài toán thị giác.", "task": "Tạo CNN đơn giản cho ảnh thời trang.", "code": "", "stage": 6, "number": 5}, {"id": "6-5", "title": "Regularization, dropout & checkpoint", "theory": "Dropout, weight decay và early stopping giảm overfitting. Checkpoint lưu model và optimizer để tiếp tục train.", "task": "So sánh learning curve khi bật/tắt dropout.", "code": "", "stage": 6, "number": 6}, {"id": "6-6", "title": "Transfer learning và đánh giá", "theory": "Tái sử dụng backbone pretrained giúp giảm dữ liệu và thời gian train. Phải theo dõi chất lượng trên dữ liệu mới.", "task": "Fine-tune mô hình ảnh nhỏ và lập báo cáo lỗi.", "code": "", "stage": 6, "number": 7}], "id": 6, "quiz": {"q": "Lệnh nào xóa gradient cũ trong training loop?", "answers": ["optimizer.zero_grad()", "model.save()", "torch.reset()", "loss.stop()"], "correct": 0, "why": "Thường dùng optimizer.zero_grad() trước backward() để không cộng dồn gradient ngoài ý muốn."}}, {"name": "NLP, Transformers & LLM", "sub": "Xử lý ngôn ngữ, token và kiến trúc Transformer", "weeks": 9, "color": "#a286fa", "icon": "✦", "level": "Trung cấp", "outcome": "Hiểu cách LLM hoạt động và tạo ứng dụng NLP có kiểm thử.", "resource": "https://huggingface.co/learn/llm-course/chapter1/1", "units": [{"id": "7-0", "title": "NLP cơ bản và biểu diễn văn bản", "theory": "Text phải chuyển thành số để mô hình xử lý. Bag of Words, TF-IDF và embeddings là các cách biểu diễn.", "task": "Viết hệ thống phân loại cảm xúc đơn giản bằng TF-IDF.", "code": "# Cài trước: pip install scikit-learn\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nv = TfidfVectorizer()\nx = v.fit_transform([\"học AI\", \"học Python\", \"Python với AI\"])\nprint(x.shape)", "stage": 7, "number": 1}, {"id": "7-1", "title": "Tokenization và embeddings", "theory": "Tokenizer chia văn bản thành tokens. Embeddings ánh xạ tokens/đoạn văn thành vector chứa quan hệ ngữ nghĩa.", "task": "So sánh tokenization của 3 câu tiếng Việt.", "code": "", "stage": 7, "number": 2}, {"id": "7-2", "title": "Attention và Transformer", "theory": "Attention giúp mô hình tập trung vào token liên quan; Transformer xếp nhiều khối attention/FFN.", "task": "Vẽ sơ đồ truy vấn Q, khóa K, giá trị V ở mức trực quan.", "code": "", "stage": 7, "number": 3}, {"id": "7-3", "title": "Pretraining, fine-tuning và inference", "theory": "Pretraining học quy luật tổng quát; fine-tuning điều chỉnh cho nhiệm vụ; inference là bước sinh kết quả.", "task": "Mô tả pipeline chạy một mô hình Hugging Face pretrained.", "code": "", "stage": 7, "number": 4}, {"id": "7-4", "title": "Prompt engineering & structured output", "theory": "Viết yêu cầu, ngữ cảnh, ví dụ và format đầu ra rõ ràng. JSON Schema hỗ trợ kiểm soát định dạng nhưng vẫn cần kiểm tra dữ liệu.", "task": "Thiết kế prompt trích xuất thông tin sản phẩm thành JSON.", "code": "", "stage": 7, "number": 5}, {"id": "7-5", "title": "Evaluation, hallucination và safety", "theory": "Đo độ đúng, độ phù hợp, độ trễ, chi phí và rủi ro. Model có thể tạo thông tin sai dù trả lời tự tin.", "task": "Tạo bộ 20 câu hỏi thử nghiệm và đánh giá bằng rubric.", "code": "", "stage": 7, "number": 6}, {"id": "7-6", "title": "Ứng dụng NLP/LLM đầu tiên", "theory": "Kết hợp giao diện, logic xử lý, kiểm tra kết quả và logging. Có thể dùng mô hình mở chạy local thay vì API tính phí.", "task": "Làm ứng dụng tóm tắt văn bản với kiểm tra độ dài và log lỗi.", "code": "", "stage": 7, "number": 7}], "id": 7, "quiz": {"q": "Hallucination của LLM là gì?", "answers": ["Chạy nhanh", "Sinh thông tin không được bảo đảm đúng", "Mất mạng", "Tăng RAM"], "correct": 1, "why": "LLM có thể sinh câu trả lời thuyết phục nhưng sai hoặc không có căn cứ."}}, {"name": "RAG & AI tìm kiếm tài liệu", "sub": "Chunking, retrieval, vector DB và trích dẫn nguồn", "weeks": 9, "color": "#55c7d9", "icon": "⌕", "level": "Ứng dụng AI", "outcome": "Xây chatbot hỏi đáp trên tài liệu, có dẫn nguồn và kiểm thử retrieval.", "resource": "https://huggingface.co/learn/llm-course/chapter1/1", "units": [{"id": "8-0", "title": "RAG giải quyết vấn đề gì?", "theory": "RAG truy xuất tài liệu liên quan rồi cung cấp cho LLM tạo câu trả lời. Không thay thế kiểm chứng vì truy xuất và sinh đều có thể sai.", "task": "Thiết kế luồng PDF → chunk → embed → search → answer.", "code": "", "stage": 8, "number": 1}, {"id": "8-1", "title": "Đọc PDF và chuẩn hóa tài liệu", "theory": "Trích xuất text, metadata và phân trang. Với bản scan cần xử lý OCR và kiểm tra chất lượng đầu vào.", "task": "Tạo bộ nhập 3 tài liệu và lưu metadata nguồn/trang.", "code": "", "stage": 8, "number": 2}, {"id": "8-2", "title": "Chunking và chiến lược chia đoạn", "theory": "Chunk quá nhỏ mất ngữ cảnh, quá lớn làm giảm chất lượng truy vấn. Chunk theo tiêu đề/đoạn thường tốt hơn cắt tùy ý.", "task": "Thử 2 kích thước chunk và so độ chính xác truy xuất.", "code": "", "stage": 8, "number": 3}, {"id": "8-3", "title": "Embedding và vector search", "theory": "Embedding ánh xạ đoạn và truy vấn vào cùng không gian vector. Cosine similarity hỗ trợ tìm tài liệu gần nghĩa.", "task": "Làm semantic search đơn giản bằng cosine similarity.", "code": "# Tìm kiếm vector đơn giản, chạy bằng Python chuẩn\nimport math\ndef cosine(a, b):\n    return sum(x*y for x,y in zip(a,b))/(math.dist(a,[0]*len(a))*math.dist(b,[0]*len(b)))\nprint(cosine([1,0.5,0],[0.7,0.2,0.1]))", "stage": 8, "number": 4}, {"id": "8-4", "title": "FAISS, Chroma và hybrid retrieval", "theory": "Vector index tăng tốc truy tìm; BM25 tìm theo từ khóa, hybrid kết hợp. Reranking sắp xếp lại các kết quả.", "task": "So sánh keyword search và vector search trên 15 câu hỏi.", "code": "", "stage": 8, "number": 5}, {"id": "8-5", "title": "Grounding và dẫn nguồn", "theory": "Trả lời chỉ khi tài liệu hỗ trợ, trích nguồn cụ thể và từ chối khi thiếu bằng chứng. Ngăn prompt injection từ dữ liệu truy xuất.", "task": "Buộc hệ thống hiện tên file và trang bên cạnh mỗi câu trả lời.", "code": "", "stage": 8, "number": 6}, {"id": "8-6", "title": "Đánh giá hệ thống RAG", "theory": "Đo retrieval recall, groundedness, độ đúng và latency. Dùng bộ test gồm cả câu không có câu trả lời.", "task": "Tạo 30 test case, đo và cải tiến pipeline retrieval.", "code": "", "stage": 8, "number": 7}], "id": 8, "quiz": {"q": "Trong RAG, bước retrieval dùng để làm gì?", "answers": ["Đổi mật khẩu", "Lấy ngữ cảnh liên quan", "Train lại LLM toàn phần", "Thiết kế CSS"], "correct": 1, "why": "Retrieval tìm đoạn tài liệu liên quan trước khi model tạo câu trả lời."}}, {"name": "AI Agents & Tool Calling", "sub": "Lập kế hoạch, gọi công cụ, quản lý bộ nhớ và luồng agent", "weeks": 9, "color": "#fb9c6e", "icon": "⚡", "level": "Ứng dụng AI", "outcome": "Xây agent dùng công cụ an toàn với giới hạn quyền và con người duyệt.", "resource": "https://huggingface.co/learn/agents-course/unit0/introduction", "units": [{"id": "9-0", "title": "Agent khác chatbot thế nào?", "theory": "Agent có thể function daysStreak(){const a=new Set(db.sessions.filter(x=>x.minutes>0).map(x=>x.date));let d=new Date();let run=0;for(let i=0;i<365;i++){const ds=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(a.has(ds)){run++}else if(i>0||a.size===0){break}d.setDate(d.getDate()-1)}return run}
function todayStr(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getStage(u){return stages[u.stage]}
function navHtml(list){return list.map(([p,ic,name])=>`<button class="nav-button ${page===p?'active':''}" data-page="${p}"><span class="ico">${ic}</span><span>${name}</span></button>`).join('')}
function chrome(){id('sideNav').innerHTML=navHtml(MENU);id('toolNav').innerHTML=navHtml(TOOLS);id('bottomNav').innerHTML=[MENU[0],MENU[1],MENU[2],MENU[3],TOOLS[3]].map(([p,ic,name])=>`<button data-page="${p}" class="${page===p?'active':''}"><i>${ic}</i>${p==='home'?'Tổng quan':p==='roadmap'?'Lộ trình':p==='lesson'?'Học ngay':p==='projects'?'Dự án':'Cài đặt'}</button>`).join('');id('sidebarLabel').textContent=`${lessonDone()}/${units.length} bài đã hoàn thành`;id('sidebarBar').style.width=pct(lessonDone(),units.length)+'%';id('crumbName').textContent={home:'Tổng quan',roadmap:'Lộ trình học',lesson:'Bài học chi tiết',projects:'Dự án',resources:'Tài liệu',week:'Kế hoạch tuần',focus:'Đồng hồ tập trung',journal:'Sổ tay học tập',settings:'Cài đặt'}[page];id('todayDate').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function go(p,opts={}){page=p;if(opts.unit){unitId=opts.unit;db.lastUnit=unitId;persist()}if(opts.project){selectedProject=opts.project}id('sidebar').classList.remove('open');render();if(!opts.keepScroll)scrollTop()}
function render(){chrome();const fn={home:renderHome,roadmap:renderRoadmap,lesson:renderLesson,projects:renderProjects,resources:renderResources,week:renderWeek,focus:renderFocus,journal:renderJournal,settings:renderSettings}[page];id('content').innerHTML=`<div class="view">${fn()}</div>`;if(page==='focus')updateTimerDisplay();}
const prog=(a,b)=>`<div class="track"><i style="width:${pct(a,b)}%"></i></div>`;

<div class="section-title"><h2>Dự án sắp tới</h2><button class="text-btn" data-page="projects">Tất cả dự án →</button></div><div class="small-cards">${nextProjects.map(p=>`<button class="link-tile" style="text-align:left" data-project="${p.id}"><strong>${esc(p.name)} ↗</strong><p>${esc(p.description)}</p></button>`).join('')}</div>
</div><div><section class="panel"><div class="eyebrow">TIẾN ĐỘ TỔNG THỂ</div><div class="ring" style="--pct:${p}%"><div><strong>${p}%</strong><small>Hoàn thành</small></div></div><p style="text-align:center;font-size:11px;color:#9cafc2">${done} / ${all} bài học • ${projectCompleted()} / ${projects.length} dự án</p><div class="phase-strip">${stages.map(s=>`<i class="${stageDone(s)===s.units.length?'done':stageDone(s)>0?'current':''}" title="${attr(s.name)}"></i>`).join('')}</div><div class="tiny" style="text-align:center">Mỗi khối đại diện một giai đoạn</div></section><section class="panel" style="margin-top:16px"><div class="eyebrow">PHƯƠNG PHÁP HỌC ĐỀ XUẤT</div><h3>45 phút mỗi ngày là điểm khởi đầu tốt</h3><div class="mini-step"><div class="number">15′</div><div><strong>Hiểu khái niệm</strong><p>Đọc lý thuyết và xem ví dụ.</p></div></div><div class="mini-step"><div class="number">20′</div><div><strong>Tự viết và sửa lỗi</strong><p>Thực hành không sao chép thụ động.</p></div></div><div class="mini-step"><div class="number">10′</div><div><strong>Ôn lại kiến thức</strong><p>Ghi chú, tự giải thích và đánh dấu.</p></div></div><button class="btn sm" data-page="focus" style="margin-top:13px;width:100%">◷ Bật đồng hồ tập trung</button></section></div></div>`}

function renderLesson(){const u=unitById(unitId),s=getStage(u),idx=units.findIndex(x=>x.id===u.id),record=db.checks[u.id]||{};return `<div class="headline"><div class="eyebrow">GIAI ĐOẠN ${s.id+1} • BÀI ${u.number}/${s.units.length}</div><h1>${esc(u.title)}</h1><p>${esc(s.name)} • ${esc(s.sub)}</p></div><div class="split"><div><section class="panel lesson-card"><div class="lesson-header"><span class="pill">${esc(s.level)}</span><div class="btn-row" style="margin:0"><button class="btn sm" data-page="roadmap">↖ Lộ trình</button><button class="btn sm" data-quiz="${s.id}">Trắc nghiệm</button></div></div>

${u.code?`<h3>03 / Ví dụ code minh họa</h3><div class="code-wrap"><div class="code-top"><span>● &nbsp; Python demo</span><button data-copy-code="${u.id}">⧉ Sao chép</button></div><pre>${esc(u.code)}</pre></div><div class="tiny">Ví dụ chỉ là điểm khởi đầu — hãy biến đổi code và tự dự đoán kết quả trước khi chạy.</div>`:`<h3>03 / Thực hành chủ động</h3><p style="font-size:12px">Bài này tập trung vào thiết kế và kiến thức nền. Nếu chưa có code mẫu, hãy dùng công cụ bên dưới để tự triển khai một đoạn Python nhỏ hoặc ghi lời giải vào sổ tay.</p>`}

function renderWeek(){const u=currentUnit();const steps=[['Nắm khái niệm','Đọc lý thuyết, diễn giải bằng 3 câu và ghi thuật ngữ mới.'],['Chạy ví dụ','Tự nhập đoạn code minh họa hoặc thực hành công cụ, dự đoán đầu ra.'],['Giải bài tập','Thực hành độc lập; không xem lời giải ngay.'],['Sửa lỗi và cải thiện','Thử đầu vào lạ, tìm bug, cải thiện code và đặt tên biến.'],['Đối chiếu tài liệu','Đọc tài liệu chính thức, bổ sung khái niệm còn thiếu.'],['Tự làm mini-task','Viết lại bài tập không nhìn mẫu, commit code lên GitHub.'],['Ôn lặp lại','Tự giải thích, quiz, ghi chú 3 lỗi hay gặp.']];return `<div class="headline"><div class="eyebrow">ĐỀ XUẤT THỰC HÀNH 7 NGÀY</div><h1>Mỗi ngày một <strong class="gradient">bước nhỏ.</strong></h1><p>Lịch gợi ý cho bài hiện tại: <b>${esc(u.title)}</b>. Có thể học nhanh hơn hoặc dành 2 tuần cho một bài khó. Không có hạn chót cứng.</p></div><div class="panel"><div class="settings-box"><div><strong style="font-size:13px">Thời lượng mục tiêu: ${db.minutes} phút/ngày</strong><div class="tiny">Lý thuyết ${Math.round(db.minutes*.3)}′ • Code ${Math.round(db.minutes*.5)}′ • Ôn ${Math.max(5,Math.round(db.minutes*.2))}′</div></div><button class="btn sm" data-page="settings">Chỉnh thời lượng →</button></div><div style="height:18px"></div><div class="calendar-grid">${steps.map((s,i)=>`<div class="day-card"><div class="day">NGÀY ${i+1}</div><strong>${s[0]}</strong><p>${s[1]}</p><span class="pill">${db.minutes} phút</span></div>`).join('')}</div><div class="btn-row"><button data-open-unit="${u.id}" class="btn primary">Vào bài hiện tại →</button><button data-page="focus" class="btn">Bắt đầu đếm giờ</button></div></div><div class="faq">Gợi ý để không quên: ôn lại nội dung sau 1 ngày, 3 ngày và 7 ngày. Lịch này không tự gửi thông báo.</div>`}
function renderFocus(){const log=db.sessions.slice(-7).reverse();return `<div class="headline"><div class="eyebrow">DEEP WORK • HỌC CÓ TẬP TRUNG</div><h1>Một phiên học <strong class="gradient">tập trung.</strong></h1><p>Đặt đồng hồ rồi học một nhiệm vụ. Hệ thống ghi thời gian khi đồng hồ chạy hết, hoặc khi bạn bấm “Lưu phiên đã học”.</p></div><div class="layout-two"><section class="panel"><div class="timer-wrapper"><div class="pill">◷ CHẾ ĐỘ TẬP TRUNG</div><div class="timer" id="timerDisplay">${formatTimer(timerSeconds)}</div><div class="timer-info">${db.minutes} phút mỗi phiên • tránh chuyển việc giữa chừng</div><div class="btn-row" style="justify-content:center"><button class="btn primary" id="timerStart">▶ ${timerRunning?'Tạm dừng':'Bắt đầu'}</button><button class="btn" id="timerReset">↺ Làm mới</button><button class="btn" id="timerSave" ${timerStarted?'':'disabled'}>✓ Lưu phiên đã học</button></div></div><div class="callout"><b>Nhiệm vụ đề xuất:</b> ${esc(currentUnit().task)}</div></section><section class="panel"><h2>Nhật ký gần đây</h2><p class="muted" style="font-size:11px">Tổng thời gian: ${(minutesStudied()/60).toFixed(1)} giờ</p>${log.length?log.map(x=>`<div class="mini-step"><div class="number">◷</div><div><strong>${esc(x.date)}</strong><p>${x.minutes} phút tập trung</p></div></div>`).join(''):'<div class="empty">Chưa có phiên học. Bắt đầu phiên đầu tiên nhé!</div>'}</section></div>`}
function renderJournal(){const withNotes=units.filter(u=>(db.notes[u.id]||'').trim());return `<div class="headline"><div class="eyebrow">SECOND BRAIN • GHI CHÉP ĐỂ NHỚ LÂU</div><h1>Sổ tay <strong class="gradient">AI Engineer.</strong></h1><p>Ghi lại những điều đã hiểu, lỗi từng gặp, từ tiếng Anh chuyên ngành và ý tưởng dự án. Ghi chú chỉ lưu trên thiết bị/trình duyệt hiện tại.</p></div><div class="layout-two"><section class="panel"><h2>Ghi chú tổng hợp</h2><div class="input-group"><textarea id="generalNotes" style="min-height:320px" placeholder="Những kiến thức phải nhớ, mục tiêu tuần này, tài liệu cần xem...">${esc(db.generalNotes||'')}</textarea></div><button class="btn primary" id="saveJournal">Lưu sổ tay</button></section><section class="panel"><h2>Ghi chú theo bài (${withNotes.length})</h2>${withNotes.length?withNotes.map(u=>`<button class="link-tile" style="width:100%;text-align:left;margin:8px 0" data-open-unit="${u.id}"><strong>${esc(u.title)} →</strong><p>${esc((db.notes[u.id]||'').slice(0,120))}</p></button>`).join(''):'<p class="muted" style="font-size:12px">Chưa có ghi chú riêng. Mở một bài học để thêm ghi chú.</p>'}</section></div>`}
function renderSettings(){return `<div class="headline"><div class="eyebrow">CÁ NHÂN HÓA</div><h1>Thiết lập <strong class="gradient">hành trình học.</strong></h1><p>Dữ liệu tiến độ, ghi chú và đồng hồ được lưu vào localStorage của trình duyệt. Hãy xuất bản sao lưu định kỳ để không mất dữ liệu khi xóa bộ nhớ hoặc đổi thiết bị.</p></div><div class="layout-two"><section class="panel"><h2>Thời lượng mỗi ngày</h2><p class="muted" style="font-size:12px">Không cần học dồn. Hãy chọn khoảng thời gian bạn có thể duy trì.</p><div class="settings-box"><div style="font-size:27px;font-family:'Space Grotesk'" id="minuteLabel">${db.minutes}<small style="font-size:13px"> phút / ngày</small></div><input id="minutesRange" type="range" min="15" max="120" step="15" value="${db.minutes}" aria-label="Thời lượng học mỗi ngày"></div><div class="faq">Lộ trình ${totalWeeks} tuần là khung tham khảo chứ không phải cam kết đạt trình độ nâng cao sau đúng từng ấy tuần. Năng lực phụ thuộc việc tự làm và đánh giá dự án.</div><h2 style="margin-top:23px">Sao lưu và phục hồi</h2><p class="muted" style="font-size:12px">Xuất file JSON để chuyển tiến độ sang máy hoặc trình duyệt khác. Không chia sẻ file nếu bạn có ghi chú cá nhân.</p><div class="btn-row"><button class="btn primary" id="exportData">↓ Xuất dữ liệu JSON</button><button class="btn" id="importData">↑ Nhập bản sao lưu</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></section><section class="panel"><h2>Thông tin chương trình</h2><div class="mini-step"><div class="number">12</div><div><strong>12 giai đoạn</strong><p>Từ tư duy AI, Python đến mô hình, RAG, agent và vận hành.</p></div></div><div class="mini-step"><div class="number">${units.length}</div><div><strong>${units.length} bài học</strong><p>Lý thuyết ngắn, nhiệm vụ rõ và checklist tự đánh giá.</p></div></div><div class="mini-step"><div class="number">12</div><div><strong>12 dự án</strong><p>Tiến dần từ CLI Python tới capstone.</p></div></div><div class="mini-step"><div class="number">↳</div><div><strong>Không trả phí dịch vụ AI</strong><p>Website chạy offline; playground Python cần Internet tải mã nguồn mở. Các khóa học ngoài có thể có lựa chọn trả phí, nhưng nguồn liên kết cơ bản đều có nội dung truy cập miễn phí.</p></div></div><div style="height:20px"></div><button class="btn sm" style="color:#ffb4b7;border-color:#824651" id="resetAll">Đặt lại toàn bộ tiến độ</button></section></div>`}
function formatTimer(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function updateTimerDisplay(){const e=id('timerDisplay');if(e)e.textContent=formatTimer(timerSeconds);const b=id('timerStart');if(b)b.textContent=timerRunning?'Ⅱ Tạm dừng':'▶ Bắt đầu'}
function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null;timerRunning=false;updateTimerDisplay()}
function saveSession(){const elapsed=db.minutes*60-timerSeconds;if(elapsed<60){toast('Hãy học ít nhất 1 phút trước khi lưu.');return}stopTimer();const mins=Math.max(1,Math.round(elapsed/60));db.sessions.push({date:todayStr(),minutes:mins});persist();timerStarted=false;timerSeconds=db.minutes*60;toast(`Đã lưu ${mins} phút học. Tuyệt vời!`);render()}
function startTimer(){if(timerRunning){stopTimer();return}timerStarted=true;timerRunning=true;let last=Date.now();timerInterval=setInterval(()=>{const now=Date.now(),delta=Math.max(1,Math.round((now-last)/1000));last=now;timerSeconds=Math.max(0,timerSeconds-delta);updateTimerDisplay();if(!timerSeconds){stopTimer();db.sessions.push({date:todayStr(),minutes:db.minutes});persist();timerStarted=false;toast(`Hoàn thành ${db.minutes} phút tập trung!`);render()}},1000);updateTimerDisplay();const b=id('timerSave');if(b)b.disabled=false}
function download(filename,text,contentType){const a=document.createElement('a'),blob=new Blob([text],{type:contentType||'application/octet-stream'});a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function openQuiz(stageId){const s=stages[stageId];quizResult=null;id('modalHost').innerHTML=`<div class="modal" data-close-modal="1"><section class="modal-content"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">TỰ KIỂM TRA • CHẶNG ${s.id+1}</div><h2>${esc(s.name)}</h2></div><button class="icon-btn" data-close-modal="1">×</button></div><p style="font-size:13px">${esc(s.quiz.q)}</p>${s.quiz.answers.map((a,i)=>`<button class="answer" data-answer="${s.id}:${i}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}<div id="quizFeedback" style="margin-top:12px"></div></section></div>`}
function answerQuiz(stageId,answer){const s=stages[stageId],correct=answer===s.quiz.correct;document.querySelectorAll('[data-answer]').forEach((b,i)=>{b.disabled=true;if(i===s.quiz.correct)b.classList.add('good');if(i===answer&&!correct)b.classList.add('bad')});id('quizFeedback').innerHTML=`<div class="callout"><strong>${correct?'✓ Chính xác!':'Chưa đúng, hãy xem giải thích.'}</strong><div style="margin-top:6px">${esc(s.quiz.why)}</div></div>`;if(correct){db.completedQuizzes[s.id]=true;persist()}}
function changeChecklist(key,checked){const u=unitById(unitId);db.checks[u.id]={...(db.checks[u.id]||{}),[key]:checked};if(!checked)db.checks[u.id].complete=false;persist();const r=db.checks[u.id],b=id('completeUnit');if(b){b.disabled=!(r.theory&&r.practice&&r.review);b.textContent=r.complete?'✓ Đã hoàn thành — học lại bất kỳ lúc nào':'✓ Đánh dấu hoàn thành'}}
function closeModal(){id('modalHost').innerHTML=''}
function workerCode(){return `let pyodide=null;async function initialize(){importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');pyodide=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});}self.onmessage=async(e)=>{if(e.data.type==='run'){try{if(!pyodide){postMessage({type:'loading'});await initialize()}const source=e.data.code;pyodide.globals.set('user_source',source);const result=await pyodide.runPythonAsync('import io, contextlib, traceback\\n_output=io.StringIO()\\ntry:\\n    with contextlib.redirect_stdout(_output), contextlib.redirect_stderr(_output):\\n        exec(compile(user_source, "<editor>", "exec"), {"__name__":"__main__"})\\nexcept Exception:\\n    traceback.print_exc(file=_output)\\n_output.getvalue()');postMessage({type:'result',text:String(result||'(Chạy xong, không có lệnh print())')});}catch(error){postMessage({type:'error',text:String(error)})}}}`}
function runPython(){let code=id('codeEditor')?.value||'';db.codeEdits[unitId]=code;persist();if(!code.trim()){toast('Hãy nhập code Python trước.');return}const out=id('terminalOut');out.classList.remove('error');out.textContent='Đang tải môi trường Python (lần đầu cần Internet)...';if(pyWorker){pyWorker.terminate();pyWorker=null}clearTimeout(pyTimer);let obj=URL.createObjectURL(new Blob([workerCode()],{type:'application/javascript'}));try{pyWorker=new Worker(obj)}catch(e){out.textContent='Trình duyệt không hỗ trợ chạy playground từ file cục bộ. Hãy dùng VS Code hoặc Google Colab.';out.classList.add('error');URL.revokeObjectURL(obj);return}URL.revokeObjectURL(obj);pyWorker.onmessage=(e)=>{if(e.data.type==='loading'){out.textContent='Đang tải Pyodide qua Internet...';return}clearTimeout(pyTimer);out.textContent=e.data.text;out.classList.toggle('error',e.data.type==='error');pyWorker?.terminate();pyWorker=null};pyWorker.onerror=()=>{clearTimeout(pyTimer);out.textContent='Không tải được môi trường Python. Kiểm tra Internet hoặc chạy bằng VS Code/Colab.';out.classList.add('error');pyWorker?.terminate();pyWorker=null};pyWorker.postMessage({type:'run',code});pyTimer=setTimeout(()=>{if(pyWorker){pyWorker.terminate();pyWorker=null;out.textContent='Hết thời gian cho phép (25 giây). Nếu mạng chậm hoặc code chạy lâu, dùng VS Code / Colab.';out.classList.add('error')}},25000)}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||typeof obj!=='object'||!obj.checks||!obj.sessions||!Array.isArray(obj.sessions))throw Error('Sai định dạng');if(!confirm('Nhập bản sao lưu sẽ thay thế tiến độ hiện tại. Bạn chắc chắn?'))return;db={...defaultData(),...obj};if(![15,30,45,60,75,90,105,120].includes(Number(db.minutes)))db.minutes=45;timerSeconds=db.minutes*60;stopTimer();persist();toast('Phục hồi thành công!');go('home')}catch(e){toast('Không đọc được bản sao lưu hợp lệ.')}};reader.readAsText(file)}
// Event delegation keeps functionality intact after re-render.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.closeModal){if(e.target===b||b.tagName==='BUTTON')closeModal();return}
 if(b.dataset.page){go(b.dataset.page);return}
 if(b.dataset.openUnit){go('lesson',{unit:b.dataset.openUnit});return}
 if(b.dataset.stage!==undefined){db.expanded=+b.dataset.stage;persist();go('roadmap');return}
 if(b.dataset.expand!==undefined){db.expanded=db.expanded===+b.dataset.expand?-1:+b.dataset.expand;persist();render();return}
 if(b.dataset.filter){levelFilter=b.dataset.filter;render();return}
 if(b.dataset.project){showProject(b.dataset.project);return}
 if(b.dataset.quiz!==undefined){openQuiz(+b.dataset.quiz);return}
 if(b.dataset.answer){const [s,a]=b.dataset.answer.split(':').map(Number);answerQuiz(s,a);return}
 if(b.dataset.copyCode){const u=unitById(b.dataset.copyCode);navigator.clipboard?.writeText(u.code).then(()=>toast('Đã sao chép code.')).catch(()=>toast('Không thể sao chép, hãy chọn code thủ công.'));return}
 if(b.id==='menuToggle'){id('sidebar').classList.toggle('open');return}
 if(b.id==='topBackup'||b.id==='exportData'){download('ai-engineer-academy-backup.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');toast('Đã tạo file sao lưu.');return}
 if(b.id==='importData'){id('importFile').click();return}
 if(b.id==='resetAll'){if(confirm('Xóa toàn bộ tiến độ, ghi chú, phiên học đã lưu trên trình duyệt này?')){db=defaultData();timerSeconds=db.minutes*60;stopTimer();persist();go('home');toast('Đã đặt lại dữ liệu.')}return}
 if(b.id==='saveUnitNotes'){db.notes[unitId]=id('unitNotes').value;persist();toast('Đã lưu ghi chú bài học.');return}
 if(b.id==='saveJournal'){db.generalNotes=id('generalNotes').value;persist();toast('Đã lưu sổ tay.');return}
 if(b.id==='completeUnit'){const r=db.checks[unitId]||{};if(!(r.theory&&r.practice&&r.review))return;r.complete=true;db.checks[unitId]=r;persist();toast('Chúc mừng! Bài học đã hoàn thành.');render();return}
 if(b.id==='nextUnit'){const i=units.findIndex(u=>u.id===unitId);if(i+1<units.length)go('lesson',{unit:units[i+1].id});return}
 if(b.id==='markProject'){const k=selectedProject,p=projects.find(x=>x.id===k);if((db.projectChecks[k]||[]).filter(Boolean).length!==p.tasks.length)return;db.projectDone[k]=true;persist();closeModal();toast('Hoàn thành dự án '+p.id+'!');render();return}
 if(b.id==='timerStart'){startTimer();return}
 if(b.id==='timerReset'){stopTimer();timerStarted=false;timerSeconds=db.minutes*60;updateTimerDisplay();const bb=id('timerSave');if(bb)bb.disabled=true;return}
 if(b.id==='timerSave'){saveSession();return}
 if(b.id==='runPython'){runPython();return}
 if(b.id==='stopPython'){clearTimeout(pyTimer);if(pyWorker){pyWorker.terminate();pyWorker=null}const o=id('terminalOut');if(o)o.textContent='Đã dừng chạy Python.';return}
 if(b.id==='resetCode'){const u=unitById(unitId);id('codeEditor').value=u.code||'print("Xin chào AI Engineer!")';db.codeEdits[unitId]=id('codeEditor').value;persist();return}
 if(b.id==='copyEditor'){navigator.clipboard?.writeText(id('codeEditor').value).then(()=>toast('Đã sao chép code.')).catch(()=>toast('Hãy sao chép thủ công.'));return}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.lessonCheck){changeChecklist(el.dataset.lessonCheck,el.checked);return}
 if(el.dataset.projectCheck){const [k,index]=el.dataset.projectCheck.split(':');let a=db.projectChecks[k]||[];a[+index]=el.checked;db.projectChecks[k]=a;if(!el.checked)db.projectDone[k]=false;persist();const btn=id('markProject');if(btn)btn.disabled=a.filter(Boolean).length!==projects.find(p=>p.id===k).tasks.length;return}
 if(el.id==='importFile'){importData(el.files[0]);return}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='roadSearch'){query=el.value;const pos=el.selectionStart;render();const s=id('roadSearch');s.focus();s.setSelectionRange(pos,pos);return}
 if(el.id==='resSearch'){resourceSearch=el.value;const pos=el.selectionStart;render();const s=id('resSearch');s.focus();s.setSelectionRange(pos,pos);return}
 if(el.id==='minutesRange'){db.minutes=Number(el.value);id('minuteLabel').innerHTML=`${db.minutes}<small style="font-size:13px"> phút / ngày</small>`;persist();if(!timerRunning){timerSeconds=db.minutes*60}return}
 if(el.id==='codeEditor'){db.codeEdits[unitId]=el.value;persist();return}
});
