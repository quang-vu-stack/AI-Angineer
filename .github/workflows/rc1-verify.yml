name: Game verification

on:
  push:
    branches:
      - 'release/v0.2-rc1'
      - 'feature/ai-brain-v03'
      - 'integration/v0.3'
      - 'feature/ai-brain-v04'
      - 'integration/v0.4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Backend tests
        run: npm run test:backend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Preserve browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
