name: Publish V0.4 RC1 to GitHub Pages
on:
  push:
    branches: ['deploy/v0.4-web']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/deploy/v0.4-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:backend
      - name: Build Pages subpath
        run: npm run build -- --base=/AI-Angineer/
      - name: Validate static entry and local asset paths
        run: |
          test -s dist/index.html
          node --input-type=module -e 'import fs from "node:fs"; const h=fs.readFileSync("dist/index.html","utf8"); const paths=[...h.matchAll(/(?:src|href)="(\/AI-Angineer\/assets\/[^"]+)"/g)].map(m=>m[1]); if(!paths.length||paths.some(p=>!fs.existsSync("dist/"+p.slice("/AI-Angineer/".length)))) throw Error("Missing Pages assets");'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
